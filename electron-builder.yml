appId: com.alterstare.envelope
productName: Envelope
copyright: Copyright © 2026 alterstare
publish:
  provider: github
  owner: alterstare
  repo: Envelope
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
  # better-sqlite3 ships its C sources (~10MB); only the built .node is needed.
  - '!node_modules/better-sqlite3/deps/**'
  - '!node_modules/better-sqlite3/src/**'
  - '!node_modules/better-sqlite3/binding.gyp'
  - LICENSE
# better-sqlite3 is already the Electron-ABI prebuilt (scripts/native.mjs on
# install): don't let electron-builder try to compile it.
npmRebuild: false
# Native addons must live outside the asar.
asarUnpack:
  - node_modules/better-sqlite3/**
  - node_modules/sharp/**
  - node_modules/@img/**
win:
  # from Env_icon_v2.png: npm run icons (every size rendered on its own)
  icon: build/icon.ico
  target:
    - nsis
    - zip
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # No spaces: on-disk name == latest.yml url == uploaded asset name, so the
  # updater can find the installer.
  artifactName: ${productName}-Setup-${version}.${ext}
linux:
  icon: build/icons
  target:
    - AppImage
    - tar.gz
  category: AudioVideo
  artifactName: ${productName}-${version}.${ext}
