<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' env-media:; img-src 'self' env-media: data: blob:; media-src 'self' env-media: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Envelope</title>
    <!-- the saved theme (set on <html> by the preload) colours the very first
         paint, before the stylesheet arrives — no light flash in dark mode -->
    <style>
      html[data-theme="dark"] { background: #0b0d13; color-scheme: dark; }
      html[data-theme="light"] { background: #f4f5f8; color-scheme: light; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
